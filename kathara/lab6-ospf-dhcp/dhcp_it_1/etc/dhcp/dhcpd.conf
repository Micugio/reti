# TODO: lease time 600 s (max 7200 s), subnet 192.168.1.0/24, pool 192.168.1.150 - 192.168.1.174,
# gateway 192.168.1.100, DNS server 192.168.1.110, domain name uniroma3.it

# dhcp_it_1/etc/dhcp/dhcpd.conf
default-lease-time 600;
max-lease-time 7200;
subnet 192.168.1.0 netmask 255.255.255.0 { # Primo ip = ip della rete su cui c'è il server DHCP e il client. Secondo ip = maschera di quella rete
  range 192.168.1.150 192.168.1.174; # pool range dei vari indirizzi ip che il server DHCP può dare ai client.
  option routers 192.168.1.100; # il suo indirizzo ip
  option domain-name-servers 192.168.1.110; # indirizzo ip del DNS
  option domain-name "uniroma3.it"; # nome del dominio
}